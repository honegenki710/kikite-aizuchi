<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聞き上手さん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#e7ebef; --panel:#f8fafb; --fg:#1f2a33; --muted:#5d6b77; --accent:#2f6f73; --accent-fg:#ffffff;
  --bubble:#ffffff; --line:#cfd7de; --wall:#d9e0e6;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14191e; --panel:#1d242b; --fg:#e8edf1; --muted:#9aa8b4; --accent:#6db3ae; --accent-fg:#0f1a1a;
  --bubble:#26303a; --line:#33404b; --wall:#1a2128; color-scheme:dark}}
html,body{height:100%;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;margin:0;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px;box-sizing:border-box;gap:10px}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  background:radial-gradient(120% 80% at 50% 30%,var(--panel),var(--wall));border-radius:20px;overflow:hidden}
.bubble{position:absolute;top:14px;left:50%;transform:translateX(-50%) scale(.9);opacity:0;
  background:var(--bubble);color:var(--fg);font-family:var(--font-display);font-weight:700;font-size:clamp(20px,6.5vw,28px);
  padding:10px 22px;border-radius:22px;box-shadow:0 6px 18px rgb(0 0 0 / .12);white-space:nowrap;transition:opacity .25s,transform .25s;z-index:2}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--bubble);border-bottom:0}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.bubble.hint{font-size:17px;font-weight:500;color:var(--muted)}
svg.person{width:100%;max-width:340px;height:auto;max-height:100%;display:block;cursor:pointer}
#head{transform-box:view-box;transform-origin:150px 280px}
#head.nod{animation:nod .55s ease-in-out}
#head.nod2{animation:nod2 .95s ease-in-out}
#head.small{animation:small .5s ease-in-out}
@keyframes nod{0%,100%{transform:none}40%{transform:translateY(5px) scaleY(.985)}}
@keyframes nod2{0%,100%{transform:none}22%{transform:translateY(6px) scaleY(.982)}48%{transform:none}72%{transform:translateY(5px) scaleY(.985)}}
@keyframes small{0%,100%{transform:none}50%{transform:translateY(2.5px)}}
#body{transform-box:view-box;transform-origin:150px 360px;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.008)}}
.eye{transform-box:fill-box;transform-origin:center}
.eye.blink{animation:blink .16s ease-in-out}
@keyframes blink{50%{transform:scaleY(.08)}}
#brows{transition:transform .25s}
#brows.up{transform:translateY(-5px)}
#mouthOpen{opacity:0;transition:opacity .08s}
.talk #mouthOpen{opacity:1}
.talk #mouthShut{opacity:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);min-height:22px}
.meter{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:var(--muted);transition:width .08s}
.meter i.on{background:var(--accent)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.6;left:30%}
.heard{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px;margin:0}
.sens{display:flex;align-items:center;gap:10px;font-size:14px}
.sens input{flex:1;accent-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;cursor:pointer}
.primary{flex:1;background:var(--accent);color:var(--accent-fg)}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.tapbtn{width:100%;background:var(--bubble);color:var(--fg);border:1px dashed var(--accent)}
.note{font-size:12.5px;line-height:1.6;color:var(--muted);margin:0}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.picker::-webkit-scrollbar{display:none}
.chip{min-width:0;padding:7px 4px;border-radius:12px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;background:transparent;color:var(--fg);border:1px solid var(--line)}
.chip small{font-weight:400;color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:var(--accent-fg);opacity:.85}
[hidden]{display:none!important}
</style></head><body>
<div class="app">
<div class="stage" id="stage">
<div class="bubble show hint" id="bubble">どうぞ、話してください</div>
<svg class="person" id="person" viewBox="0 0 300 360" role="img" aria-label="聞き手の男性">
<defs>
<radialGradient id="skin" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#f1cfb4"/><stop offset=".65" stop-color="#e2b394"/><stop offset="1" stop-color="#c99475"/></radialGradient>

<linearGradient id="hairg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3632"/><stop offset=".55" stop-color="#2a2623"/><stop offset="1" stop-color="#4a4541"/></linearGradient>
<linearGradient id="knit" x1="0" y1="0" x2="0" y2="1"><stop id="k1" offset="0" stop-color="#4b5d6e"/><stop id="k2" offset="1" stop-color="#34424f"/></linearGradient>
<radialGradient id="stub" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#5a4a42" stop-opacity=".22"/><stop offset="1" stop-color="#5a4a42" stop-opacity="0"/></radialGradient>
</defs>
<g id="body">

<circle cx="150" cy="346" r="3" fill="#cfd6dc"/></g>
</g>
<path d="M124 228 L124 286 Q150 306 176 286 L176 228 Z" fill="url(#neckg)"/>
<g id="head">
<path id="hairBack" d="M72 170 C62 100 96 52 150 50 C204 52 240 100 230 170 C234 210 238 250 240 272 C224 286 204 282 196 266 L104 266 C96 282 76 286 60 272 C62 250 66 210 72 170 Z" fill="#3a2a22" hidden/>
<ellipse cx="81" cy="172" rx="12" ry="21" fill="#d9a585"/>
<ellipse cx="219" cy="172" rx="12" ry="21" fill="#d9a585"/>
<path d="M84 176 Q78 170 82 162" stroke="#b07a5c" stroke-width="2" fill="none"/>
<path d="M216 176 Q222 170 218 162" stroke="#b07a5c" stroke-width="2" fill="none"/>
<path d="M150 72 C206 72 222 112 220 166 C218 214 196 252 150 258 C104 252 82 214 80 166 C78 112 94 72 150 72 Z" fill="url(#skin)"/>
<ellipse id="stubble" cx="150" cy="224" rx="58" ry="36" fill="url(#stub)"/>
<path id="hair" d="M78 164 C66 100 98 52 152 50 C208 50 236 94 222 164 C218 136 210 114 194 104 C170 92 128 94 108 104 C92 114 84 134 78 164 Z" fill="#2e2a27"/>
<g id="grey">
<path d="M84 150 C84 132 90 118 100 110" stroke="#9a948f" stroke-width="3" fill="none" opacity=".75"/>
<path d="M216 150 C216 132 210 118 200 110" stroke="#9a948f" stroke-width="3" fill="none" opacity=".75"/>
</g>
<path id="shine" d="M120 66 C140 58 172 58 196 72" stroke="#ffffff" stroke-width="2.5" fill="none" opacity=".15"/>
<g id="age">
<path d="M128 118 Q150 114 172 118" stroke="#b98466" stroke-width="1.2" fill="none"/>
<path d="M110 170 Q120 174 130 170" stroke="#b07a5c" stroke-width="1.2" fill="none"/>
<path d="M170 170 Q180 174 190 170" stroke="#b07a5c" stroke-width="1.2" fill="none"/>
<path d="M128 200 Q122 214 128 228" stroke="#b07a5c" stroke-width="1.4" fill="none"/>
<path d="M172 200 Q178 214 172 228" stroke="#b07a5c" stroke-width="1.4" fill="none"/>
</g>
<g id="brows">
<path class="brow" d="M103 141 Q118 132 136 138" stroke="#2f2a27" stroke-width="5.5" stroke-linecap="round" fill="none"/>
<path class="brow" d="M164 138 Q182 132 197 141" stroke="#2f2a27" stroke-width="5.5" stroke-linecap="round" fill="none"/>
</g>
<g class="eye" id="eyeL">
<ellipse cx="120" cy="160" rx="11" ry="6.2" fill="#f7f3ef"/>
<circle cx="121" cy="160" r="5.2" fill="#4a3426"/><circle cx="121" cy="160" r="2.3" fill="#1b120d"/>
<circle cx="123" cy="158" r="1.3" fill="#fff"/>
<path class="lid" d="M108 158 Q120 150 132 158" stroke="#5a3f31" stroke-width="2" fill="none"/>
</g>

<ellipse cx="180" cy="160" rx="11" ry="6.2" fill="#f7f3ef"/>
<circle cx="179" cy="160" r="5.2" fill="#4a3426"/><circle cx="179" cy="160" r="2.3" fill="#1b120d"/>
<circle cx="181" cy="158" r="1.3" fill="#fff"/>

</g>
<g id="glasses" fill="none" stroke="#3a3a3c" stroke-width="2.2" opacity=".85">
<rect x="102" y="146" width="38" height="27" rx="9"/>
<rect x="160" y="146" width="38" height="27" rx="9"/>
<path d="M140 156 Q150 151 160 156"/>
<path d="M102 154 L84 150"/><path d="M198 154 L216 150"/>
</g>
<path d="M150 162 C147 180 141 192 142 198 Q150 204 158 198" stroke="#a8715a" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M152 166 C152 180 156 188 158 196" stroke="#f6d8c2" stroke-width="2" fill="none" opacity=".6"/>
<g id="cheeks" opacity=".18"><ellipse cx="112" cy="196" rx="12" ry="7" fill="#e08f7a"/><ellipse cx="188" cy="196" rx="12" ry="7" fill="#e08f7a"/></g>
<g id="mouthShut"><path id="lips" d="M132 220 Q150 229 168 220" stroke="#8a4f42" stroke-width="3" fill="none" stroke-linecap="round"/></g>
<g id="mouthOpen"><path d="M134 219 Q150 222 166 219 Q160 233 150 234 Q140 233 134 219 Z" fill="#6e3a32"/><path d="M138 220 Q150 222 162 220" stroke="#f3eeea" stroke-width="2.4" fill="none"/></g>
</g>
</svg>
</div>
<div class="panel">
<div class="picker" id="picker" role="group" aria-label="聞き手を選ぶ"></div>
<div class="status"><span id="statusText">準備OK</span><div class="meter" id="meterBox" hidden><i id="meter"></i><b id="thrMark"></b></div></div>
<p class="heard" id="heard"></p>
<label class="sens" id="sensRow" hidden>感度<input type="range" id="sens" min="1" max="10" value="6"></label>
<div class="row">
<button class="primary" id="startBtn">話しはじめる</button>
<button class="ghost" id="voiceBtn">声：オフ</button>
</div>
<button class="tapbtn" id="tapBtn" hidden>話の区切りでタップ</button>
<p class="note" id="note">iPhoneの音声認識で話を聞き取り、話の切れ目でうなずいて相槌を返します。聞き取った言葉は相槌を選ぶのに使うだけで、保存はしません。</p>
</div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const head=$('head'),brows=$('brows'),bubble=$('bubble'),stage=$('stage');
const eyes=[$('eyeL'),$('eyeR')],statusText=$('statusText'),meter=$('meter'),thrMark=$('thrMark');
const startBtn=$('startBtn'),voiceBtn=$('voiceBtn'),tapBtn=$('tapBtn'),note=$('note'),heard=$('heard'),sens=$('sens');
try{const v=localStorage.getItem('kikite-sens');if(v)sens.value=v}catch(e){}
sens.addEventListener('input',()=>{try{localStorage.setItem('kikite-sens',sens.value)}catch(e){}});

const WB={
 short:['うん','はい','ええ','うん、うん'],
 mid:['うんうん','なるほど','そうなんですね','へえ','ほう','それで？'],
 long:['なるほどねえ','そうだったんですね','わかります','うんうん、それで？','へえ、そうなんだ'],
 hard:['それは大変でしたね','うーん、それはしんどいですね','そうでしたか…'],
 good:['それはよかったですね','いいですねえ','へえ、いいなあ'],
 ask:['うーん、どうでしょうね','なるほど、悩みますね','そうですねえ'],
 cont:['うん','うんうん','ええ']
};

/* 聞き手の切り替え */
const CH=[
 {id:'yuji',name:'ゆうじさん',age:'40代',pitch:.8,
  hair:'#2e2a27',hairD:'M78 164 C66 100 98 52 152 50 C208 50 236 94 222 164 C218 136 210 114 194 104 C170 92 128 94 108 104 C92 114 84 134 78 164 Z',
  back:false,grey:true,glasses:true,stubble:true,wr:.45,brow:'#2f2a27',bw:5.5,lid:2,lips:'#8a4f42',cheek:.18,k:['#4b5d6e','#34424f'],collar:'#e9eef2',buttons:true},
 {id:'misaki',name:'みさきさん',age:'30代',pitch:1.15,
  hair:'#3d2a20',hairD:'M76 172 C66 100 100 52 152 50 C206 52 236 98 224 172 C220 140 212 118 200 106 C186 122 150 132 118 124 C102 128 86 146 76 172 Z',
  back:true,grey:false,glasses:false,stubble:false,wr:0,brow:'#4a3528',bw:3.6,lid:3,lips:'#b9574e',cheek:.32,k:['#d8b7a6','#b98f7d'],collar:'#f6efe9',buttons:false,
  words:{short:['うん','うんうん','そっか'],mid:['うんうん','そうなんだ','へえ、そうなんだ','なるほどね','それで？'],long:['そうだったんだね','わかるなあ','うんうん、それで？'],hard:['それは大変だったね','しんどかったね','そっか…'],good:['よかったね！','いいなあ','うれしいね']}},
 {id:'haruko',name:'はるこさん',age:'60代',pitch:1.05,
  hair:'#b9b4ae',hairD:'M72 178 C58 110 94 48 150 46 C206 48 244 110 228 178 C226 152 218 128 204 114 C190 104 172 114 150 106 C128 114 112 104 98 114 C84 128 76 152 72 178 Z',
  back:false,grey:false,glasses:true,stubble:false,wr:.6,brow:'#8d8580',bw:3.8,lid:2.4,lips:'#a65a54',cheek:.26,k:['#8e6f86','#6d5367'],collar:'#efe6ec',buttons:true,
  words:{short:['うん','ええ','うんうん'],mid:['あらまあ','そうなのねえ','うんうん','へえ','それで？'],long:['そうだったのねえ','わかるわ','うんうん、それで？'],hard:['それは大変だったわねえ','よくがんばったわね','あらあら…'],good:['よかったわねえ','いいわねえ','うれしいわね']}},
 {id:'kenta',name:'けんたくん',age:'20代',pitch:.95,
  hair:'#4a3426',hairD:'M80 158 C72 96 104 54 152 52 C200 54 230 94 220 158 C216 130 208 114 196 108 C182 120 152 122 130 116 C114 116 100 120 92 130 C86 138 82 148 80 158 Z',
  back:false,grey:false,glasses:false,stubble:false,wr:0,brow:'#3a2a20',bw:5,lid:2,lips:'#985549',cheek:.2,k:['#5f7d5a','#465f43'],collar:'#465f43',buttons:false,
  words:{short:['うん','はい','うんうん'],mid:['へえ！','なるほど','そうなんですね','まじですか','それで？'],long:['なるほどなあ','わかります','へえ、それでそれで？'],hard:['それはきついですね','大変でしたね','うわあ…'],good:['いいですね！','最高じゃないですか','うらやましいです']}}
];
let cur=CH[0];
const setAttr=(id,a,v)=>$(id).setAttribute(a,v);
const show=(id,on)=>on?$(id).removeAttribute('hidden'):$(id).setAttribute('hidden','');
function applyChar(c){
 cur=c;
 setAttr('hair','d',c.hairD);setAttr('hair','fill',c.hair);setAttr('hairBack','fill',c.hair);
 show('hairBack',c.back);show('grey',c.grey);show('glasses',c.glasses);show('stubble',c.stubble);show('buttons',c.buttons);
 setAttr('age','opacity',c.wr);show('age',c.wr>0);
 document.querySelectorAll('.brow').forEach(b=>{b.setAttribute('stroke',c.brow);b.setAttribute('stroke-width',c.bw)});
 document.querySelectorAll('.lid').forEach(l=>l.setAttribute('stroke-width',c.lid));
 setAttr('lips','stroke',c.lips);setAttr('cheeks','opacity',c.cheek);
 setAttr('k1','stop-color',c.k[0]);setAttr('k2','stop-color',c.k[1]);setAttr('collar','fill',c.collar);
 setAttr('person','aria-label','聞き手の'+c.name);
 document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===c.id));
 try{localStorage.setItem('kikite-char',c.id)}catch(e){}
}
CH.forEach(c=>{const b=document.createElement('button');b.className='chip';b.dataset.id=c.id;b.type='button';
 b.innerHTML=c.name+'<small>'+c.age+'</small>';b.addEventListener('click',()=>{applyChar(c);anim(head,'small');say('よろしくね',true)});$('picker').appendChild(b)});
let saved='yuji';try{saved=localStorage.getItem('kikite-char')||'yuji'}catch(e){}
applyChar(CH.find(c=>c.id===saved)||CH[0]);

const W=new Proxy({},{get:(o,k)=>(cur.words&&cur.words[k])||WB[k]});
let last='';
function pick(l){let w;do{w=l[Math.floor(Math.random()*l.length)]}while(l.length>1&&w===last);last=w;return w}
function choose(ms,t){
 t=(t||'').trim();
 if(/疲れ|大変|しんど|つら|辛|困っ|忙し|最悪|怒|悲し|痛/.test(t))return pick(W.hard);
 if(/嬉し|うれし|楽し|よかった|良かった|最高|おいし|美味し|好き|助かっ/.test(t))return pick(W.good);
 if(/[？?]$|かな$|ですか$|ますか$|でしょうか$|どう思/.test(t))return pick(W.ask);
 if(/(けど|けれど|から|ので|して|って)$/.test(t))return pick(W.cont);
 return ms<1500?pick(W.short):ms<5000?pick(W.mid):pick(W.long);
}
function anim(el,c){el.classList.remove('nod','nod2','small');void el.getBoundingClientRect();el.classList.add(c)}
function blink(){eyes.forEach(e=>{e.classList.remove('blink');void e.getBoundingClientRect();e.classList.add('blink')})}
(function bl(){setTimeout(()=>{blink();bl()},2500+Math.random()*3500)})();
let voiceOn=false,speakingOut=false,bubbleTimer;
voiceBtn.addEventListener('click',()=>{voiceOn=!voiceOn;voiceBtn.textContent='声：'+(voiceOn?'オン':'オフ')});
function say(word,hint){
 bubble.classList.toggle('hint',!!hint);bubble.textContent=word;bubble.classList.add('show');
 clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),1900);
}
function aizuchi(ms,text){
 const w=choose(ms,text);
 anim(head,/うん|ええ/.test(w)?'nod2':'nod');
 if(/へえ|ほう|それで/.test(w)){brows.classList.add('up');setTimeout(()=>brows.classList.remove('up'),900)}
 stage.classList.add('talk');setTimeout(()=>stage.classList.remove('talk'),380);
 if(Math.random()<.4)setTimeout(blink,300);
 say(w);
 if(voiceOn&&'speechSynthesis'in window){
  try{const u=new SpeechSynthesisUtterance(w);u.lang='ja-JP';u.pitch=cur.pitch;speakingOut=true;
   u.onend=u.onerror=()=>setTimeout(()=>speakingOut=false,500);speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){speakingOut=false}
 }
}
$('person').addEventListener('click',()=>anim(head,'small'));
tapBtn.addEventListener('click',()=>aizuchi(2000+Math.random()*3000,''));

let running=false,inSeg=false,segStart=0,lastVoice=0,lastAizuchi=0,lastNod=0,segText='',timer=null;
function finish(now){
 inSeg=false;
 if(now-lastAizuchi>900){lastAizuchi=now;lastNod=now;aizuchi(lastVoice-segStart,segText)}
 segText='';statusText.textContent='聞いています';
}
function heardVoice(now){
 if(!inSeg){inSeg=true;segStart=now}
 lastVoice=now;statusText.textContent='聞いています…';
 if(now-lastNod>3200&&now-segStart>2500&&now-lastAizuchi>2000){lastNod=now;anim(head,'small')}
}

/* 方式1：iPhoneの音声認識（言葉で区切りを判断） */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recFails=0;
function startWords(){
 rec=new SR();rec.lang='ja-JP';rec.continuous=true;rec.interimResults=true;
 let gotAny=false;
 rec.onresult=e=>{
  if(speakingOut)return;
  gotAny=true;recFails=0;
  const r=e.results[e.results.length-1];
  segText=r[0].transcript;heard.textContent='「'+segText+'」';
  heardVoice(performance.now());
 };
 rec.onerror=e=>{
  if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){rec=null;startVolume();}
 };
 rec.onend=()=>{
  if(!running||!rec)return;
  if(!gotAny)recFails++;
  if(recFails>4){rec=null;startVolume();return}
  setTimeout(()=>{try{rec&&rec.start()}catch(e){}},150);
 };
 try{rec.start()}catch(e){rec=null;startVolume();return}
 timer=setInterval(()=>{const n=performance.now();if(inSeg&&n-lastVoice>800)finish(n)},100);
 note.textContent='iPhoneの音声認識で話を聞き取り、話の切れ目でうなずいて相槌を返します。聞き取った言葉は相槌を選ぶのに使うだけで、保存はしません。';
}

/* 方式2：声の大きさで判断（音声認識が使えないとき） */
let ctx,analyser,stream,data,floor=0.002;
async function startVolume(){
 clearInterval(timer);
 if(!running)return;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){statusText.textContent='マイクが使えませんでした';tapBtn.hidden=false;
  note.textContent='マイクを使えないようです。話しながら、区切りで下のボタンをタップすると相槌を返します。';return}
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 try{await ctx.resume()}catch(e){}
 const src=ctx.createMediaStreamSource(stream);
 analyser=ctx.createAnalyser();analyser.fftSize=1024;src.connect(analyser);
 data=new Float32Array(analyser.fftSize);
 $('meterBox').hidden=false;$('sensRow').hidden=false;heard.textContent='';
 note.textContent='声の大きさで話の切れ目を判断しています。話してもバーが縦線を越えないときは、感度を上げてください。';
 requestAnimationFrame(loop);
}
const scale=v=>Math.min(100,Math.sqrt(v/0.08)*100);
function loop(t){
 if(!running||!analyser)return;
 analyser.getFloatTimeDomainData(data);
 let s=0;for(let i=0;i<data.length;i++)s+=data[i]*data[i];
 const rms=Math.sqrt(s/data.length);
 const k=+sens.value;
 const thr=Math.max(floor*(1.5+4/k),0.02/(k*k));
 const voiced=rms>thr&&!speakingOut;
 if(rms<floor)floor=floor*.9+rms*.1;else if(!voiced)floor=floor*.995+rms*.005;
 meter.style.width=scale(rms)+'%';meter.classList.toggle('on',voiced);thrMark.style.left=scale(thr)+'%';
 if(voiced)heardVoice(t);
 else if(inSeg&&t-lastVoice>550){if(t-segStart>400)finish(t);else inSeg=false}
 requestAnimationFrame(loop);
}

async function start(){
 if(running){stop();return}
 running=true;startBtn.textContent='やめる';statusText.textContent='聞いています';
 say('うん、どうぞ',true);anim(head,'small');
 if(SR)startWords();else startVolume();
}
function stop(){
 running=false;clearInterval(timer);
 try{rec&&rec.stop()}catch(e){}rec=null;
 try{stream&&stream.getTracks().forEach(t=>t.stop());ctx&&ctx.close()}catch(e){}
 analyser=null;startBtn.textContent='話しはじめる';statusText.textContent='おつかれさまでした';
}
startBtn.addEventListener('click',start);
})();
</script>
